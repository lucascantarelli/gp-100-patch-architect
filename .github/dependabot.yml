# Dependabot — o que este repositório realmente tem para atualizar.
#
# Desde a profissionalização 2.0 o projeto TEM dependências Python: `typer` e
# `rich` (runtime) e `pytest`, `pytest-cov`, `ruff`, `mypy`, `pre-commit` (dev)
# vivem em `pyproject.toml`, com o `uv.lock` commitado — o lockfile é o
# contrato: o CI nunca resolve versão nova sozinho (`uv sync --frozen`).
# O ecossistema correto para o Dependabot vigiar isso é `uv` (não `pip`: o
# manifesto é o do uv). PR de dependência que quebre o lockfile reprova no
# `uv sync --frozen` do CI — é essa a trava.
#
# O TypeScript dos agentes continua sob demanda (`npx -p typescript@…` no CI,
# sem package.json): não há manifesto npm para vigiar.
#
# GitHub Actions segue o bloco de baixo: mantê-las atualizadas é o que permite
# fixá-las por SHA (recomendação de hardening em SECURITY.md) sem envelhecerem.

version: 2
updates:
  # ── Dependências Python (pyproject.toml + uv.lock) ─────────────────────────
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
    # Um PR por semana com minor+patch juntas: menos ruído, revisão única.
    # Bump de major muda contrato (API, flags, gates de lint) — PR separado,
    # para ser lido com atenção em vez de mergeado no lote semanal.
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ── GitHub Actions dos workflows ────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "ci"
    # Um PR por semana com todas as actions juntas: menos ruído, revisão única.
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Bump de major de action muda contrato (inputs, permissões) — PR separado,
    # para ser lido com atenção em vez de mergeado no lote semanal.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
