# CI do GP-100 Patch Architect — dois jobs em paralelo + um portão de veredito.
#
#   Fase 1 (paralela):
#     test-suite    — compila os scripts e roda a suíte unittest (stdlib pura,
#                     sem dependências): formato dos `.prst`, docs, momentos,
#                     índices, ordem estável entre sistemas operacionais e o
#                     GUARDA DE SINCRONIA (TestH): o pipeline roda inteiro numa
#                     cópia temporária do repositório e o teste compara o
#                     resultado com o commitado (só o `preset_info/@time` é
#                     ignorado). Se um derivado estiver defasado, o PR reprova e
#                     o teste imprime o comando exato de conserto. Nada é
#                     escrito no repositório.
#     typecheck     — `tsc --noEmit` nos 17 agentes (`.agents/*.ts`), com cache
#                     do TypeScript baixado via npx.
#   Fase 2 (portão):
#     ci-gate       — veredito único do CI: reprova se qualquer job da fase 1
#                     falhou. É o check para "exigir" nas regras do GitHub.
#
# Nenhum job escreve no repositório — o workflow inteiro roda com
# `permissions: contents: read`. É uma decisão, não um acidente: um ator
# automatizado capaz de empurrar no `main` obrigaria a branch protection a
# abrir exceção para o app `github-actions`, e essa exceção vale para TODO
# workflow do repositório (não só para este job). Sem escrita, a proteção do
# `main` não precisa de exceção nenhuma — ver `setup_repo.sh`.
#
# Fluxo de branches (detalhado em CONTRIBUTING.md): `feature/**` é onde se
# trabalha (única que aceita push direto), `develop` é a integração e `main` é o
# que foi publicado. Push em `feature/**` NÃO dispara CI de propósito: o PR para
# a `develop` já é o gatilho, e manter os dois causaria duas execuções para o
# mesmo commit.
#
# O que substituiu o antigo auto-commit: nada. Ele duplicava um mecanismo que já
# existia (o guarda de frescor reprova e diz o comando) e era a única coisa do
# repositório que entrava no `main` sem passar por CI.
#
# Runner e runtime: `ubuntu-24.04` (não o label mutável `-latest`) e actions de
# primeira parte no major que já declara `using: node24`. As duas regras vivem no
# auditor `.github/scripts/audit_workflows.py` e existem por causa do que ele
# agora reprova: imagem de runner que troca sem commit e o aviso "Node.js 20 is
# deprecated", que aparecia em todo job e ninguém lia.
#
# Rode a mesma verificação localmente:
#   python -m unittest discover -s tests -v

name: CI

on:
  # `main` e `develop` são as branches de integração: o push nelas é o merge de
  # um PR, e é onde o veredito precisa aparecer. Todo PR roda, sem filtro de base
  # (feature → develop e develop → main).
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# Piso de permissões do workflow — e o teto: nenhum job eleva daqui.
permissions:
  contents: read

# Uma execução por ref. Sem nenhum job escrevendo no repositório, não existe mais
# a corrida de dois auto-commits disputando o mesmo push: uma execução
# superseded sempre pode ser cancelada, inclusive no `main`.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Fase 1 · testes ────────────────────────────────────────────────────────
  test-suite:
    name: 🧪 Testes — suíte do pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: 1/2 · Compilar todos os scripts (tools/ + tests/)
        run: python -m py_compile tools/*.py tests/*.py

      - name: 2/2 · Suíte unittest — defs, .prst, docs, momentos, índices, sincronia e ordem entre OS
        run: python -m unittest discover -s tests -v

  # ── Fase 1 · agentes ───────────────────────────────────────────────────────
  typecheck:
    name: 🔍 Agentes — tsc --noEmit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Cache do TypeScript baixado via npx
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-typescript-5.9.2-${{ runner.os }}

      - name: tsc --noEmit (tsconfig.json — 17 agentes)
        run: npx -y -p typescript@5.9.2 tsc --noEmit -p tsconfig.json

  # ── Fase 2 · portão ────────────────────────────────────────────────────────
  ci-gate:
    name: 🚦 Veredito do CI
    needs: [test-suite, typecheck]
    if: always()               # roda mesmo com job falho — para dar o veredito
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reprovar se qualquer job da fase 1 não passou
        run: |
          {
            echo "### 🚦 Veredito do CI"
            echo ""
            echo "| Job | Resultado |"
            echo "|---|---|"
            echo "| test-suite | ${{ needs.test-suite.result }} |"
            echo "| typecheck | ${{ needs.typecheck.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          falhas="${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}"
          if [ "$falhas" = "true" ]; then
            echo "❌ Um ou mais jobs falharam — veja os detalhes no resumo." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ Todos os jobs passaram." >> "$GITHUB_STEP_SUMMARY"
