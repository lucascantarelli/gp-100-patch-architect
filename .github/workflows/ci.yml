# CI do GP-100 Patch Architect — três jobs em paralelo + um portão de veredito.
#
#   Fase 1 (paralela):
#     test-suite    — instala o ambiente com `uv sync --frozen` (lockfile é o
#                     contrato: o CI nunca resolve versão nova sozinho) e roda a
#                     suíte COMPLETA com pytest: formato dos `.prst`, docs,
#                     momentos, índices, ordem estável entre sistemas operacionais
#                     e o GUARDA DE SINCRONIA (TestH) — o pipeline roda inteiro
#                     numa cópia temporária do repositório e o teste compara o
#                     resultado com o commitado (só o `preset_info/@time` é
#                     ignorado). Se um derivado estiver defasado, o PR reprova e o
#                     teste imprime o comando exato de conserto. Nada é escrito
#                     no repositório. Cobertura do pacote medida com piso em 90%
#                     (`[tool.coverage.report] fail_under`).
#     quality       — ruff (lint + formatação) e mypy --strict no pacote.
#                     `tools/`, `.github/scripts/` e a suíte histórica ficam fora
#                     da lista enquanto a migração (PKG-003…009) não os traz;
#                     cada módulo migrado entra nos gates no mesmo PR.
#     typecheck     — `tsc --noEmit` nos agentes (`.agents/*.ts`), com cache do
#                     TypeScript baixado via npx.
#   Fase 2 (portão):
#     ci-gate       — veredito único do CI: reprova se qualquer job da fase 1
#                     falhou. É o check para "exigir" nas regras do GitHub.
#
# Nenhum job escreve no repositório — o workflow inteiro roda com
# `permissions: contents: read`. É uma decisão, não um acidente: um ator
# automatizado capaz de empurrar no `main` obrigaria a branch protection a
# abrir exceção para o app `github-actions`, e essa exceção vale para TODO
# workflow do repositório (não só para este job). Sem escrita, a proteção do
# `main` não precisa de exceção nenhuma — ver `setup_repo.sh`.
#
# Fluxo de branches (detalhado em CONTRIBUTING.md): `develop` é onde se trabalha
# (push direto liberado, CI a cada push) e `main` é o que foi publicado — só
# recebe código pelo PR de release (develop → main, merge commit).
#
# O que substituiu o antigo auto-commit: nada. Ele duplicava um mecanismo que já
# existia (o guarda de frescor reprova e diz o comando) e era a única coisa do
# repositório que entrava no `main` sem passar por CI.
#
# Runner e runtime: `ubuntu-24.04` (não o label mutável `-latest`) e actions de
# primeira parte no major que já declara `using: node24`. As duas regras vivem no
# auditor `.github/scripts/audit_workflows.py` e existem por causa do que ele
# agora reprova: imagem de runner que troca sem commit e o aviso "Node.js 20 is
# deprecated", que aparecia em todo job e ninguém lia.
#
# Actions de terceiro ficam fixadas por commit SHA (tag móvel pode ser
# reescrita; o CodeQL reprova e o auditor de workflows também). Actions de
# primeira parte (`actions/*`, `github/*`) seguem no major, com o Dependabot
# vigiando. O pin do `astral-sh/setup-uv` abaixo resolve para a tag v7.
#
# Rode a mesma verificação localmente:
#   uv sync && uv run ruff check . && uv run ruff format --check . && uv run mypy
#   uv run pytest -q --cov --cov-report=term-missing

name: CI

on:
  # O push na `develop` é a checagem de cada commit de trabalho; o push na
  # `main` é o merge da release aprovada. Todo PR roda também — sem filtro de
  # base (o de release é develop → main).
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# Piso de permissões do workflow — e o teto: nenhum job eleva daqui.
permissions:
  contents: read

# Uma execução por ref. Sem nenhum job escrevendo no repositório, não existe mais
# a corrida de dois auto-commits disputando o mesmo push: uma execução
# superseded sempre pode ser cancelada, inclusive no `main`.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Fase 1 · testes ────────────────────────────────────────────────────────
  test-suite:
    name: 🧪 Testes — suíte completa + cobertura
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # Política do projeto: Python 3.14 APENAS (doc 19 / issue #16). O pin do
      # setup-python não fecha a porta sozinho — qualquer coisa que preceda o
      # python do setup no PATH (ou um step futuro que troque o runtime) passa
      # despercebida. O passo abaixo verifica o runtime que VAI executar a
      # suíte, antes de qualquer uso real de Python (py_compile, testes, ...).
      - name: 0/3 · Trava de runtime — Python 3.14.* apenas
        run: |
          v="$(python --version)"          # ex.: "Python 3.14.6"
          echo "runtime detectado: $v"
          echo "$v" | grep -Eq '^Python 3\.14\.' || {
            echo "::error::Python 3.14.* obrigatório — detectado '$v'. O projeto roda APENAS em 3.14 (política: reference/19-roadmap-v2.md, Pilar F; guarda de runtime também em tools/defs_schema.py)."
            exit 1
          }

      # Action de TERCEIRO: fixada por commit (tag móvel pode ser reescrita por
      # quem publica a Action). Este pin veio de um alerta real do CodeQL
      # (security/code-scanning, PR #35) — e o auditor de workflows passou a
      # reprovar Action de terceiro sem SHA depois disso.
      - name: uv (com cache) — toolchain oficial do projeto
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # `--frozen`: o lockfile é o contrato. Sem isso o CI resolveria versões
      # novas a cada execução e um verde de ontem não diria nada sobre hoje.
      - name: 1/3 · Ambiente do lockfile (uv sync --frozen)
        run: uv sync --frozen

      # Os scripts de tools/ ainda não estão nos gates de estilo (migração em
      # curso): a compilação continua sendo a rede que pega erro de sintaxe lá.
      - name: 2/4 · Compilar o legado ainda fora dos gates (tools/ + tests/)
        run: uv run python -m py_compile tools/*.py tests/*.py

      # ADR-0013 (issue #8): patches/** não é mais commitado — os testes de
      # produto (A–G: formato do .prst, seções do patch.md, concordância mapa ×
      # doc) precisam dos derivados, então o CI os CONSTRÓI a partir do defs.
      # O próprio TestH (H) prova em seguida que o build é determinístico num
      # sandbox sem patches/. GP100_BUILD_TIME fixo ⇒ @time estável entre runs.
      - name: 3/4 · Construir os derivados da biblioteca (defs → patches/)
        env:
          GP100_BUILD_TIME: '1700000000000'
        run: |
          uv run python tools/ir_library.py
          uv run python tools/build_song_patches.py
          uv run python tools/gen_indexes.py

      - name: 4/4 · pytest — defs, .prst, docs, momentos, índices, determinismo, ordem entre OS
        run: uv run pytest -q --cov --cov-report=term-missing

  # ── Fase 1 · qualidade ─────────────────────────────────────────────────────
  quality:
    name: 🧹 Qualidade — ruff + mypy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # Action de TERCEIRO: fixada por commit (tag móvel pode ser reescrita por
      # quem publica a Action). Este pin veio de um alerta real do CodeQL
      # (security/code-scanning, PR #35) — e o auditor de workflows passou a
      # reprovar Action de terceiro sem SHA depois disso.
      - name: uv (com cache) — toolchain oficial do projeto
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Ambiente do lockfile (uv sync --frozen)
        run: uv sync --frozen

      - name: ruff check (lint)
        run: uv run ruff check .

      - name: ruff format --check (formatação)
        run: uv run ruff format --check .

      - name: mypy --strict (pacote gp100_architect)
        run: uv run mypy

  # ── Fase 1 · agentes ───────────────────────────────────────────────────────
  typecheck:
    name: 🔍 Agentes — tsc --noEmit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Cache do TypeScript baixado via npx
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-typescript-5.9.2-${{ runner.os }}

      - name: tsc --noEmit (tsconfig.json — 19 agentes)
        run: npx -y -p typescript@5.9.2 tsc --noEmit -p tsconfig.json

  # ── Fase 2 · portão ────────────────────────────────────────────────────────
  ci-gate:
    name: 🚦 Veredito do CI
    needs: [test-suite, quality, typecheck]
    if: always()               # roda mesmo com job falho — para dar o veredito
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reprovar se qualquer job da fase 1 não passou
        run: |
          {
            echo "### 🚦 Veredito do CI"
            echo ""
            echo "| Job | Resultado |"
            echo "|---|---|"
            echo "| test-suite | ${{ needs.test-suite.result }} |"
            echo "| quality | ${{ needs.quality.result }} |"
            echo "| typecheck | ${{ needs.typecheck.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          falhas="${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}"
          if [ "$falhas" = "true" ]; then
            echo "❌ Um ou mais jobs falharam — veja os detalhes no resumo." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ Todos os jobs passaram." >> "$GITHUB_STEP_SUMMARY"
