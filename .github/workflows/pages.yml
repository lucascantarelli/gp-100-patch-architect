# pages.yml — publica o GitHub Pages do projeto em UM deploy único:
#   * raiz     → site da biblioteca (`gp100 site`, issue #11)
#   * /docs/   → docs de engenharia (MkDocs Material, issue #60)
#
# Por que UM só deploy: o `deploy-pages@v4` não tem input de subcaminho — cada
# deploy substitui o site inteiro. Dois workflows no mesmo Pages eram
# last-writer-wins (o último deploy derrubava o site do outro; achado da
# auditoria de workflows pré-2.0.1). Esta unificação implementa a decisão
# registrada no encerramento da #60: "a doc entra no mesmo Pages, em /docs/".
#
# Fonte única: nada é versionado — `gp100 site` deriva de `data/defs/` e o
# `mkdocs build` de `scripts/prep_docs.py`, ambos NA HORA do deploy, a partir
# do checkout fresco (decisão de versionamento da #11/#60: gerar no deploy,
# publicar sem commitar). Um push na `develop` = redeploy completo, então a
# biblioteca e a doc nunca divergem entre si.
#
# Endurecimento (o auditor `audit_workflows.py` cobra):
#   * `permissions:` no topo com o PISO por job — pages: write só no deploy
#     (a TETO_PERMISSOES do auditor define o teto deste arquivo);
#   * runner fixado (`ubuntu-24.04`, nunca `-latest`) e `timeout-minutes` por job;
#   * Action de terceiro fixada por SHA (`astral-sh/setup-uv`), primeira parte
#     no major que declara node24;
#   * nenhum contexto não confiável interpolado em `run:`.
#
# Publicação é derivada e idempotente: rodar duas vezes produz o mesmo site.
name: Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🏗 Gera biblioteca + docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read       # o `configure-pages` lê a API do Pages (GET /pages)
    steps:
      - uses: actions/checkout@v7

      - name: 1/3 · Ambiente do lockfile (uv sync --frozen, extra docs)
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: '3.14'

      - run: uv sync --extra docs --frozen

      # mkdocs build --strict: navegação quebrada ou md inválido abortam o
      # deploy (trava extra da #60; o checker de links de verdade é o
      # `audit_docs.py`, que roda no CI em todo push).
      - name: 2/3 · Deriva biblioteca, stats, badges e doc do checkout fresco
        run: |
          uv run gp100 site --destino site --stats
          uv run gp100 badges --destino site
          uv run python scripts/prep_docs.py
          uv run mkdocs build --strict --site-dir site-docs

      - name: 3/3 · Monta o artefato único (biblioteca na raiz + docs em /docs/)
        run: |
          mkdir -p site/docs
          cp -r site-docs/. site/docs/

      # Sem `configure-pages`: o site é HTML estático com links relativos —
      # nenhuma base URL do Pages é necessária (e o passo exigia leitura da
      # API do Pages que não existe no build de um site novo).
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: 🚀 Publica no GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write      # publicar É o trabalho deste job (exceção justificada)
      id-token: write   # OIDC exigido pelo deploy do Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
