name: 📋 Gestão de projetos

# ─────────────────────────────────────────────────────────────────────────────
# Automação do Project v2 "GP-100 Pipeline" + guardian do fluxo PR-driven.
#
# O que faz (e o que NÃO faz — igual ao resto do CI, nada aqui escreve no git):
#
#   1. add-to-project — toda issue e todo PR entra no Project v2 no momento em
#      que é aberto. Issue nova ganha `status: needs-triage`.
#   2. status — move o card conforme o evento:
#        PR aberto (draft)  → In Progress   · PR ready_for_review → In Review
#        PR fechado/merged  → Done          · issue aberta/reaberta → Backlog
#      Os estados intermediários (Ready → In Progress) são arraste manual:
#      código não adivinha intenção humana.
#   3. guardian — reprova o PR sem label, sem issue vinculada e sem milestone
#      (o milestone em falta é aviso). Isenta o PR de release (develop → main).
#      Roda em opened/synchronize/labeled/edited: revalida a cada push e a cada
#      label aplicada — o erro diz qual regra falta, não só que falhou.
#   4. milestone — relatório de fechamento: quantos itens ficaram abertos e o
#      lembrete de migrá-los para o próximo marco.
#   5. diagnostico (workflow_dispatch) — confere token, Project, campo Kanban e
#      contagem de itens sem depender de um evento real: é o `--check` do board.
#
# ── Sobre o TOKEN (leia antes de mexer) ──────────────────────────────────────
# O `GITHUB_TOKEN` NÃO acessa Project v2 de **usuário**: a permissão de workflow
# `repository-projects` vale para Projects clássicos do repositório, e este board
# pertence ao owner (pessoa). Por isso os jobs que mexem no board usam o secret
# `PROJECT_TOKEN`: um PAT fine-grained com Projects: read/write (owner = você) e
# Issues: read/write (só neste repositório) — sem `contents: write`, ou seja, o
# token da gestão continua incapaz de empurrar em branch nenhuma (ADR-0006).
#
#   gh secret set PROJECT_TOKEN
#
# Sem o secret o workflow NÃO fica vermelho: avisa com o comando exato e segue.
# Um fork (que não recebe segredos) ou um clone novo não pode reprovar PR por
# falta de configuração local — mas também não finge que a automação rodou.
#
# Histórico — por que este cabeçalho é explícito: a versão anterior declarava
# `repository-project: write`, escopo que não existe. O arquivo inteiro era
# inválido e o GitHub falhava a cada push com "workflow file issue" **sem rodar
# um único job**: nenhuma automação de gestão jamais funcionou neste repositório,
# e nenhum push ficava verde. O `.github/scripts/audit_workflows.py` ganhou a
# regra 8 (nomes/valores de permissão válidos) para essa classe de erro não
# voltar em silêncio.
#
# O Project precisa existir antes (número + campo "Kanban" com as opções):
#   .github/scripts/bootstrap_project_management.sh ONLY=project
# ─────────────────────────────────────────────────────────────────────────────

on:
  issues:
    types: [opened, labeled, reopened]
  pull_request:
    # synchronize/labeled/edited estão aqui porque o guardian os cita no `if`:
    # sem o gatilho ele nunca revalidava o PR a cada push ou label nova.
    types:
      [opened, reopened, ready_for_review, converted_to_draft, closed,
       synchronize, labeled, edited]
  milestone:
    types: [closed]
  workflow_dispatch: # roda só o job `diagnostico` (os demais não casam evento)

# Piso do GITHUB_TOKEN: leitura. A escrita no board vem do PAT (secrets), nunca
# daqui — é a mesma decisão de todos os outros workflows (ADR-0006).
permissions:
  contents: read

env:
  PROJECT_OWNER: lucascantarelli # owner do Project (usuário, não o repo)
  PROJECT_NUMBER: "7" # número do Project v2 "GP-100 Pipeline" (gh project list)
  REPO: ${{ github.repository }} # "dono/repo" para gh --repo

jobs:
  add-to-project:
    name: 📥 Entra no Project
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
    if: >-
      github.event_name == 'issues' ||
      (github.event_name == 'pull_request' &&
        (github.event.action == 'opened' || github.event.action == 'reopened'))
    steps:
      # Falha-soft de propósito: sem o secret, avisa e não reprova (ver cabeçalho).
      - name: Pré-requisito — token com acesso ao Project
        id: token
        env:
          TOKEN: ${{ secrets.PROJECT_TOKEN }}
          FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          set -euo pipefail
          if [ -n "$TOKEN" ]; then
            echo "pronto=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pronto=0" >> "$GITHUB_OUTPUT"
          aviso="secrets.PROJECT_TOKEN ausente: o GITHUB_TOKEN não acessa Project v2 de usuário."
          instrucao="crie um PAT fine-grained (Projects: read/write + Issues: read/write) e rode: gh secret set PROJECT_TOKEN"
          if [ "${FORK:-false}" = "true" ]; then
            echo "::notice::$aviso PR de fork não recebe segredos — esperado. $instrucao"
          else
            echo "::warning::$aviso $instrucao"
          fi

      - name: Adiciona issue/PR ao Project
        if: steps.token.outputs.pronto == '1'
        env:
          URL: ${{ github.event.issue.html_url || github.event.pull_request.html_url }}
        run: |
          gh project item-add "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --url "$URL" \
            && echo "no Project #$PROJECT_NUMBER: $URL"

      # Issue nova recebe needs-triage: ninguém deve pegar tarefa não triada.
      - name: Marca issue nova como needs-triage
        if: >-
          steps.token.outputs.pronto == '1' &&
          github.event_name == 'issues' && github.event.action == 'opened'
        env:
          NUMERO: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          # `--ignore-if-missing` não existe no gh (era a versão anterior): a
          # label ausente reprova com o comando do bootstrap, não em silêncio.
          gh issue edit "$NUMERO" --repo "$REPO" --add-label "status: needs-triage" \
            || {
              echo "::error::não apliquei 'status: needs-triage' — a label existe neste repo? Rode: .github/scripts/bootstrap_project_management.sh ONLY=labels"
              exit 1
            }
          echo "needs-triage aplicada em #$NUMERO"

  status:
    name: 📊 Move o card no board
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: add-to-project
    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
    # `!= 'failure'` e não `== 'success'`: no evento `closed` o add-to-project é
    # pulado (o item já está no Project) — com `== 'success'` o Done nunca rodaria.
    # Se o add falhar de verdade, o status fica preso (conservador: sem card
    # garantido, melhor não mover).
    if: >-
      always() && needs.add-to-project.result != 'failure' &&
      (github.event_name == 'issues' || github.event_name == 'pull_request')
    steps:
      - name: Pré-requisito — token com acesso ao Project
        id: token
        env:
          TOKEN: ${{ secrets.PROJECT_TOKEN }}
          FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          set -euo pipefail
          if [ -n "$TOKEN" ]; then
            echo "pronto=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pronto=0" >> "$GITHUB_OUTPUT"
          aviso="secrets.PROJECT_TOKEN ausente: o GITHUB_TOKEN não acessa Project v2 de usuário."
          instrucao="crie um PAT fine-grained (Projects: read/write + Issues: read/write) e rode: gh secret set PROJECT_TOKEN"
          if [ "${FORK:-false}" = "true" ]; then
            echo "::notice::$aviso PR de fork não recebe segredos — esperado. $instrucao"
          else
            echo "::warning::$aviso $instrucao"
          fi

      - name: Define o estado pelo evento
        id: estado
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          valor=""
          case "$EVENT/$ACTION" in
            pull_request/opened|pull_request/reopened|pull_request/ready_for_review)
              if [ "$IS_DRAFT" = "true" ]; then valor="In Progress"; else valor="In Review"; fi ;;
            pull_request/converted_to_draft) valor="In Progress" ;;
            pull_request/closed)             valor="Done" ;;
            issues/opened|issues/reopened)   valor="Backlog" ;;
            *) echo "evento sem transição de card: $EVENT/$ACTION — nada a fazer" ;;
          esac
          echo "valor=$valor" >> "$GITHUB_OUTPUT"

      - name: Aplica o estado no campo Kanban
        if: steps.token.outputs.pronto == '1' && steps.estado.outputs.valor != ''
        env:
          URL: ${{ github.event.issue.html_url || github.event.pull_request.html_url }}
          VALOR: ${{ steps.estado.outputs.valor }}
        run: |
          set -euo pipefail

          # Campo e opção: o `gh` reclama de forma genérica; aqui o erro diz
          # exatamente o que falta e onde criar (a opção que não existe é silenciosa
          # no fluxo por nome).
          campos="$(gh project field-list "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --format json)"
          if ! printf '%s' "$campos" \
            | jq -e --arg v "$VALOR" \
              '.fields[] | select(.name == "Kanban") | .options[] | select(.name == $v)' >/dev/null; then
            echo "::error::o campo 'Kanban' (opção '$VALOR') não existe no Project #$PROJECT_NUMBER — rode: .github/scripts/bootstrap_project_management.sh ONLY=project"
            exit 1
          fi

          # O item pode não estar no board (o add-to-project é pulado no `closed`).
          # `item-list` (sem `--limit`: ele não existe) confirma antes de editar.
          itens="$(gh project item-list "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --format json)"
          if ! printf '%s' "$itens" | jq -e --arg u "$URL" '.items[] | select((.content.url // "") == $u)' >/dev/null; then
            gh project item-add "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --url "$URL" >/dev/null
          fi

          # Edição por nome (--url/--field/--value): dispensa caçar node IDs de
          # item e campo a cada evento, que era onde a versão anterior errava
          # (`--item-id`/`--option-id` não existem).
          gh project item-edit "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" \
            --url "$URL" --field "Kanban" --value "$VALOR"
          echo "$URL → $VALOR"

  guardian:
    name: 🛡 Guardian — PR precisa de gestão
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # piso: este job não checa o PR out nem lista arquivos
      pull-requests: read # gh pr view --json labels,body,milestone
    env:
      GH_TOKEN: ${{ github.token }} # leitura de PR: GITHUB_TOKEN basta
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.action == 'opened' || github.event.action == 'synchronize' ||
       github.event.action == 'reopened' || github.event.action == 'labeled' ||
       github.event.action == 'edited')
    steps:
      - name: Valida label, issue vinculada e milestone
        env:
          PR: ${{ github.event.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          falha=0

          # 1 · Label — a taxonomia vive no bootstrap (fonte única), o CI só cobra.
          n="$(gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels | length')"
          n="${n:-0}"
          if [ "$n" -eq 0 ]; then
            echo "::error::PR sem label — aplique type:, size: e scope: (taxonomia em .github/scripts/bootstrap_project_management.sh)"
            falha=1
          fi

          if [ "$BASE" = "main" ]; then
            # 2/3 · PR de release (develop → main): a gestão é o CHANGELOG + milestone.
            echo "PR de release para a main — isento de issue vinculada."
            ms="$(gh pr view "$PR" --repo "$REPO" --json milestone --jq '.milestone.title // ""')"
            if [ -z "$ms" ]; then
              echo "::warning::release sem milestone — associe a versão: gh pr edit $PR --milestone \"vX.Y.Z\""
            fi
          else
            # 2 · Issue vinculada — a regra de ouro: nada entra sem issue; a issue
            #     é fechada pelo PR (Closes #N), nunca à mão.
            corpo="$(gh pr view "$PR" --repo "$REPO" --json body --jq '.body // ""')"
            ms="$(gh pr view "$PR" --repo "$REPO" --json milestone --jq '.milestone.title // ""')"
            if ! printf '%s' "$corpo" | grep -Eq '([Cc]loses|[Ff]ixes|[Rr]esolves|[Cc]loses:|[Ff]ixes:|[Rr]efs?) ?#[0-9]+'; then
              if [ -n "$ms" ]; then
                echo "::notice::sem 'Closes #N', mas o PR está no milestone '$ms' (aceito para trabalhos de épico)"
              else
                echo "::error::sem issue vinculada — abra a issue primeiro e referencie no corpo com 'Closes #N'"
                falha=1
              fi
            fi

            # 3 · Milestone — aviso, não reprova (decision: mantenedor único).
            if [ -z "$ms" ]; then
              echo "::warning::sem milestone — associe no review: gh pr edit $PR --milestone \"v1.1.0\""
            fi
          fi

          exit "$falha"

  milestone:
    name: 🏁 Milestone fechado — relatório
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read # gh api repos/.../issues?milestone=N
    env:
      GH_TOKEN: ${{ github.token }}
    if: github.event_name == 'milestone' && github.event.action == 'closed'
    steps:
      - name: Relatório de fechamento do milestone
        env:
          MS: ${{ github.event.milestone.number }}
          TITULO: ${{ github.event.milestone.title }}
        run: |
          set -euo pipefail
          echo "### 🏁 $TITULO — fechamento" >> "$GITHUB_STEP_SUMMARY"
          gh api "repos/$REPO/issues?milestone=$MS&state=all&per_page=100" \
            --jq 'group_by(.state) | map("\(length) \(.[0].state)") | join(" · ")' \
            | tee -a "$GITHUB_STEP_SUMMARY"
          abertos="$(gh api "repos/$REPO/issues?milestone=$MS&state=open&per_page=100" --jq 'length')"
          if [ "$abertos" -gt 0 ]; then
            echo "::warning::$abertos item(ns) ainda aberto(s) no milestone $TITULO — migre para o próximo marco"
          fi

  # ── Diagnóstico manual ──────────────────────────────────────────────────────
  # Actions → este workflow → Run workflow. Responde "o board está ligado?" sem
  # depender de abrir issue/PR de teste. Aqui o token ausente REPROVA de
  # propósito: execução manual existe para diagnosticar, não para passar.
  diagnostico:
    name: 🩺 Diagnóstico do board (manual)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch'
    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
    steps:
      - name: Confere token, Project e campo Kanban
        env:
          TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then
            echo "::error::secrets.PROJECT_TOKEN ausente — crie um PAT fine-grained (Projects: read/write + Issues: read/write) e rode: gh secret set PROJECT_TOKEN"
            exit 1
          fi

          if ! campos="$(gh project field-list "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --format json 2>&1)"; then
            echo "::error::o token não leu o Project #$PROJECT_NUMBER do owner $PROJECT_OWNER: $campos"
            exit 1
          fi

          kanban="$(printf '%s' "$campos" | jq -r '.fields[] | select(.name == "Kanban") | .options | map(.name) | join(" → ")')"
          # O relatório usa só campos estáveis do item-list (title) — o nome da
          # chave de um campo customizado no JSON depende do board, e relatório de
          # diagnóstico que quebra por causa disso não serve para nada.
          itens="$(gh project item-list "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --format json)"
          total="$(printf '%s' "$itens" | jq -r '.items | length')"
          amostra="$(printf '%s' "$itens" \
            | jq -r '[.items[] | (.title // .content.title // "(sem título)")] | .[0:5] | join(" · ")')"

          {
            echo "### 🩺 Diagnóstico da gestão de projetos"
            echo ""
            echo "- Project: #$PROJECT_NUMBER (owner \`$PROJECT_OWNER\`)"
            echo "- Campo Kanban: ${kanban:-(AUSENTE — rode o bootstrap, ONLY=project)}"
            echo "- Itens no board: $total"
            echo "- Primeiros itens: ${amostra:-(vazio)}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          if [ -z "$kanban" ]; then
            echo "::error::o campo 'Kanban' não existe no Project #$PROJECT_NUMBER — rode: .github/scripts/bootstrap_project_management.sh ONLY=project"
            exit 1
          fi
          echo "::notice::as 3 visões (Kanban/Sprint/Roadmap) são manuais: o gh não cria views — guia no fim do bootstrap."
