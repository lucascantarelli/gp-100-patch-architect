# Release — publica a versão quando o merge da `develop` entra na `main`.
#
# O gatilho é o MERGE NA MAIN, não um botão: `VERSION` é a fonte única da verdade
# e quem decide a versão é o PR que a subiu. Este workflow não escreve em branch
# nenhuma — ele só cria a TAG `v<versão>` (proteção de branch não governa tag) e
# publica a Release.
#
# Fluxo de quem publica (detalhado em CONTRIBUTING.md):
#   1. no PR que prepara a release, para `develop`:
#        python tools/gen_changelog.py --version X.Y.Z --write
#        printf '%s\n' X.Y.Z > VERSION
#   2. mergeie `develop` → `main` com MERGE COMMIT (não squash);
#   3. este workflow roda sozinho — empacota, tagueia e publica.
#
# O merge commit no passo 2 é o que faz o changelog abaixo funcionar: num squash,
# a `main` receberia a release inteira como um commit só e as features (que são o
# que o gerador lê) teriam ficado na `develop`.
#
# Um merge na `main` que NÃO subiu o `VERSION` é um no-op verde: o job `decidir`
# vê que aquela versão já está publicada e o job de publicação nem roda. Reexecutar
# é seguro: os assets são reenviados com `--clobber` e as notas são atualizadas.
#
# ─────────────────────────────────────────────────────────────────────────────
# POR QUE NÃO HÁ ESCRITA NO `main` AQUI
#
# Se este job commitasse (`VERSION` + `CHANGELOG`) e empurrasse, a branch
# protection teria de abrir exceção para o app `github-actions` — e essa exceção
# vale para TODO workflow do repositório, não só para este. Sem escrita, a
# proteção da `main` e da `develop` não precisa de exceção nenhuma
# (ver `setup_repo.sh`). Criar e enviar TAG continua funcionando: proteção de
# branch não governa tag.
# ─────────────────────────────────────────────────────────────────────────────
#
# Runner e runtime: `ubuntu-24.04` (não o label mutável `-latest`) e actions de
# primeira parte no major que já declara `using: node24`. As duas regras vivem no
# auditor `.github/scripts/audit_workflows.py` e existem por causa do que ele
# agora reprova: imagem de runner que troca sem commit e o aviso "Node.js 20 is
# deprecated", que aparecia em todo job e ninguém lia.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:            # republicar/reparar a versão que está no VERSION

# Piso de permissões: só o job de publicação eleva (tag + Release).
permissions:
  contents: read

# Nunca cancelar uma release em andamento: duas publicações concorrentes
# competiriam pela mesma tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ── 0 · Há algo a publicar? ────────────────────────────────────────────────
  decidir:
    name: 🔎 Decidir — a versão do VERSION já saiu?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      publicar: ${{ steps.ver.outputs.publicar }}
      versao: ${{ steps.ver.outputs.versao }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0           # precisa das tags para comparar versões

      - name: Comparar o VERSION com as releases publicadas
        id: ver
        run: |
          set -euo pipefail
          versao="$(cat VERSION)"
          echo "versao=$versao" >> "$GITHUB_OUTPUT"

          # Regressão de versão: `sort -V` devolve o maior SemVer entre a última
          # tag publicada e a do arquivo. Se a do arquivo não for a maior, é engano
          # — e tag publicada é ruim de desfazer.
          anterior="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sort -V | tail -1)"
          if [ -n "$anterior" ] \
              && [ "$(printf '%s\n%s\n' "$anterior" "$versao" | sort -V | tail -1)" != "$versao" ]; then
            echo "::error::O VERSION ($versao) é menor que a última release publicada (v$anterior)."
            exit 1
          fi

          if gh release view "v$versao" >/dev/null 2>&1; then
            echo "publicar=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ⏭️ v$versao já está publicada — nada a fazer"
              echo ""
              echo "O \`VERSION\` não mudou desde a última release. Para publicar a"
              echo "próxima versão, suba o \`VERSION\` (e o \`CHANGELOG.md\` gerado) num"
              echo "PR para a \`develop\` e depois mergeie a \`develop\` na \`main\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publicar=true" >> "$GITHUB_OUTPUT"
            echo "### 🚀 v$versao será publicada" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ── 1 · Empacotar e publicar ───────────────────────────────────────────────
  release:
    name: 🚀 Publicar release
    needs: decidir
    if: needs.decidir.outputs.publicar == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write              # criar/enviar a tag e publicar a Release
    env:
      VERSAO: ${{ needs.decidir.outputs.versao }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0           # o changelog precisa da história e das tags

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # Nada sai daqui sem passar no que o CI exige — e a suíte já inclui o
      # guarda de sincronia (TestH: pipeline numa cópia temporária × commitado).
      - name: 1/4 · Suíte de testes (a mesma do CI, com o guarda de sincronia)
        run: |
          python -m py_compile tools/*.py tests/*.py
          python -m unittest discover -s tests -v

      - name: 2/4 · Empacotar ZIPs + notas (dist/)
        run: python tools/build_release.py "$VERSAO"

      - name: 3/4 · Seção do CHANGELOG desta versão
        run: |
          python tools/gen_changelog.py --version "$VERSAO" --out dist/changelog-section.md
          cat dist/changelog-section.md

      - name: 4/4 · Publicar (tagueia se preciso)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # A tag é o único ref que este job cria — e só se ainda não existir.
          if git rev-parse -q --verify "refs/tags/v$VERSAO" >/dev/null; then
            echo "Tag v$VERSAO já existe — não vou recriar."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "v$VERSAO" -m "GP-100 Patch Architect v$VERSAO"
            git push origin "v$VERSAO"
            echo "Tag v$VERSAO criada e enviada." >> "$GITHUB_STEP_SUMMARY"
          fi

          # Corpo = o que mudou (changelog) + o que baixar (notas do empacotador).
          cat dist/changelog-section.md dist/RELEASE-NOTES-v$VERSAO.md > dist/release-body.md

          shopt -s nullglob
          zips=(dist/gp100-patches-v$VERSAO.zip dist/gp100-patches-v$VERSAO-*.zip)

          if gh release view "v$VERSAO" >/dev/null 2>&1; then
            echo "Release v$VERSAO já existia — atualizando notas e assets."
            gh release upload "v$VERSAO" "${zips[@]}" --clobber
            gh release edit "v$VERSAO" --notes-file dist/release-body.md
          else
            gh release create "v$VERSAO" \
              --title "GP-100 Patch Architect v$VERSAO" \
              --notes-file dist/release-body.md \
              "${zips[@]}"
          fi

          {
            echo "### 📦 Assets publicados"
            echo ""
            for z in "${zips[@]}"; do echo "- \`$(basename "$z")\` ($(du -h "$z" | cut -f1))"; done
            echo ""
            echo "\`VERSION\` e \`CHANGELOG.md\` já refletem a v$VERSAO."
          } >> "$GITHUB_STEP_SUMMARY"
