# Security — SAST, revisão de dependências e endurecimento dos workflows.
#
# Por que este workflow existe separado do CI: o `ci.yml` responde "os dados e os
# testes estão coerentes?". Este responde outra pergunta: "a superfície de
# segurança do repositório continua sob controle?".
#
#   codeql             — análise estática (SAST) de Python e TypeScript.
#                        O repositório não tem dependências de terceiros, então
#                        o risco real é nos scripts que geram/validam arquivos.
#   dependency-review  — SCA por PR: reprova a introdução de dependência com
#                        vulnerabilidade alta/crítica. Hoje passa trivialmente
#                        (não há manifesto); existe para o dia em que houver.
#   workflow-hardening — audita os próprios workflows (permissões, timeout,
#                        injeção, pinagem). É o guarda da superfície que pode
#                        ESCREVER no repositório — o job de dados tem
#                        `contents: write` e commita no main.
#
# Runner e runtime: `ubuntu-24.04` (não o label mutável `-latest`) e actions de
# primeira parte no major que já declara `using: node24`. As duas regras vivem no
# auditor `.github/scripts/audit_workflows.py` e existem por causa do que ele
# agora reprova: imagem de runner que troca sem commit e o aviso "Node.js 20 is
# deprecated", que aparecia em todo job e ninguém lia.
#
# Rode o endurecimento localmente:
#   python .github/scripts/audit_workflows.py

name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Varredura semanal: a base de consultas do CodeQL e as advisories do
    # Dependabot mudam sem que o repositório mude.
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Piso de permissões: cada job eleva só o que precisa.
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── 1 · Análise estática ────────────────────────────────────────────────────
  codeql:
    name: 🔐 CodeQL — ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      security-events: write        # necessário para publicar os resultados
    strategy:
      fail-fast: false              # um idioma falhando não esconde o outro
      matrix:
        # `javascript-typescript` foi removido de propósito, e o motivo importa:
        # o único TS do repositório vive em `.agents/` (diretório com ponto). O
        # extrator JS/TS do CodeQL não o indexa — na prática ele varria só os
        # .yml do .github/ e o tsconfig.json, terminando em "CodeQL detected code
        # written in JavaScript/TypeScript but could not process any of it" e
        # deixando o check vermelho com ZERO achados. Scan de fachada é pior que
        # scan ausente: o contrato dos agentes já é verificado por `tsc --noEmit`
        # no ci.yml.
        #
        # `actions` entrou no lugar e cobre o que de fato interessa aqui: os
        # próprios workflows — a superfície que tem `contents: write`, commita no
        # main e interpola contexto de PR. É a versão automática do que o
        # `audit_workflows.py` checa por regra.
        #
        # Reative `javascript-typescript` se um dia houver JS/TS fora de
        # diretório oculto (ou se `.agents/` virar caminho visível).
        language: [python, actions]
    steps:
      - uses: actions/checkout@v7

      # Python e JavaScript/TypeScript são interpretados/jit: não há passo de
      # build. O init + analyze é o template suportado para esses idiomas.
      # v4: a v3 do CodeQL Action é depreciada em dezembro de 2026 e o próprio
      # init emite o aviso a cada execução.
      - name: Inicializar o CodeQL (${{ matrix.language }})
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # `security-extended` e não `security-and-quality`: a suíte "and-quality"
          # inclui consultas de manutenibilidade e, neste repositório, elas disparam
          # em cima de um estilo deliberado — a prosa dos docs é escrita como
          # literais adjacentes dentro de listas ("...texto " "continuação"), o que
          # gera seis avisos de "maybe missing a comma?" que nunca serão corrigidos
          # (juntar com vírgula multiplicaria as entradas da lista e quebraria o
          # markdown gerado). `security-extended` cobre TODAS as consultas de
          # segurança da `and-quality`, sem as de estilo — mais sinal, menos ruído.
          queries: security-extended

      - name: Analisar
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  # ── 2 · Revisão de dependências (só PR) ────────────────────────────────────
  dependency-review:
    name: 📦 Revisão de dependências
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write          # comenta o resumo no PR
    steps:
      - uses: actions/checkout@v7

      - name: Reprovar dependência vulnerável introduzida no PR
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # ── 3 · Endurecimento dos workflows ────────────────────────────────────────
  workflow-hardening:
    name: 🛡️ Endurecimento dos workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Auditar permissões, timeout, injeção e pinagem
        run: |
          set -o pipefail
          python .github/scripts/audit_workflows.py 2>&1 | tee hardening.log

      - name: Publicar o relatório no resumo da execução
        if: always()
        run: |
          {
            echo "### 🛡️ Endurecimento dos workflows"
            echo ""
            echo '```text'
            cat hardening.log 2>/dev/null || echo 'auditoria não chegou a rodar'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
